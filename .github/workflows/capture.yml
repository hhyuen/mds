name: Scheduled Capture

on:
  schedule:
    - cron: '0 23 * * 0-5'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run capture script
        run: node capture.js

      - name: List files after capture
        run: |
          ls -la screenshots
          find screenshots -maxdepth 2 -type f | sort

      # --- Updated OAuth Google Drive Upload Step ---
      - name: Upload screenshots to Google Drive
        uses: baimamboukar/google-drive-upload-action@v1.1.0
        with:
          credentials: |
            {
              "client_id": "${{ secrets.GDRIVE_CLIENT_ID }}",
              "client_secret": "${{ secrets.GDRIVE_CLIENT_SECRET }}",
              "refresh_token": "${{ secrets.GDRIVE_REFRESH_TOKEN }}"
            }
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # The path to your local screenshots folder
          filename: 'screenshots/' 
          # Setting to true replaces files with identical names in the folder
          overwrite: true 
          
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit --allow-empty -m "Update screenshots (Forced scheduled run)"
          git push

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
