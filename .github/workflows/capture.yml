name: Scheduled Capture

on:
  schedule:
    - cron: '0 23 * * 0-5'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run capture script
        run: node capture.js

      - name: List files after capture
        run: |
          ls -la screenshots
          find screenshots -maxdepth 2 -type f | sort

      # --- New Google Drive Upload Step ---
      - name: Upload screenshots to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          filename: "screenshots/*"
          overwrite: "true"
          supportsAllDrives: "true"
          useCompleteSourceFilenameAsName: "true"
          
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
